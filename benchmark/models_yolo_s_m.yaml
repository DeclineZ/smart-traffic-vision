# Six model families/scales, twelve artifacts. Isolated Ultralytics 8.4.142 runtime.
# PT FP16 vs TensorRT FP16; engine I/O may remain FP32 (recorded in artifact metadata).
runtime_path: runtime-yolo26
settings:
  device: cuda:0
  imgsz: 640
  conf: 0.25
  iou: 0.70
  max_det: 300
  warmup: 30
  repeats: 3
  target_fps: 30
  seed: 0
  telemetry_interval: 0.1
reference_model: v8s_fp16_pt
models:
  - id: v8s_fp16_pt
    name: YOLOv8s PyTorch FP16
    version: YOLOv8s
    path: ../models/yolov8s.pt
    backend: ultralytics
    pair_id: v8s_models_fp16
    precision: fp16
    input_size: 640
    classes: {car: 2, motorcycle: 3}
  - id: v8s_fp16_engine
    name: YOLOv8s TensorRT FP16
    version: YOLOv8s
    path: ../models/yolov8s.engine
    backend: ultralytics
    pair_id: v8s_models_fp16
    precision: fp16
    input_size: 640
    classes: {car: 2, motorcycle: 3}
    export: {nms: false, tensorrt: '10.14.1.48.post1', quantize: 16}
  - id: v8m_fp16_pt
    name: YOLOv8m PyTorch FP16
    version: YOLOv8m
    path: ../models/yolov8m.pt
    backend: ultralytics
    pair_id: v8m_models_fp16
    precision: fp16
    input_size: 640
    classes: {car: 2, motorcycle: 3}
  - id: v8m_fp16_engine
    name: YOLOv8m TensorRT FP16
    version: YOLOv8m
    path: ../models/yolov8m.engine
    backend: ultralytics
    pair_id: v8m_models_fp16
    precision: fp16
    input_size: 640
    classes: {car: 2, motorcycle: 3}
    export: {nms: false, tensorrt: '10.14.1.48.post1', quantize: 16}
  - id: v11s_fp16_pt
