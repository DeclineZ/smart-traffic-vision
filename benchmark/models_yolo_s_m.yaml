    name: YOLO11s TensorRT FP16
    version: YOLO11s
    path: ../models/yolo11s.engine
    backend: ultralytics
    pair_id: v11s_models_fp16
    precision: fp16
    input_size: 640
    classes: {car: 2, motorcycle: 3}
    export: {nms: false, tensorrt: '10.14.1.48.post1', quantize: 16}
  - id: v11m_fp16_pt
    name: YOLO11m PyTorch FP16
    version: YOLO11m
